<html lang="nl">
<head>

<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}
:root{
  box-sizing:border-box;
  --page:#e4e2df; --ink:#1a1414; --muted:#5d5452; --line:#c4bdb9; --surface:#f1efed; --bad:#b3261e; --good:#1d6b34;
  --tt-y:#ffff00; --tt-c:#00ffff; --tt-g:#00ff00; --tt-m:#ff00ff; --tt-r:#ff4040; --tt-b:#1f3dff; --tt-w:#ffffff;
  --ui:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --tt:"VT323","Courier New",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--page:#131111;--ink:#ece6e4;--muted:#ab9f9c;--line:#3a3030;--surface:#1e1a1a;--bad:#ff8a80;--good:#7ddc8f;color-scheme:dark;}
}
:root[data-theme="dark"]{--page:#131111;--ink:#ece6e4;--muted:#ab9f9c;--line:#3a3030;--surface:#1e1a1a;--bad:#ff8a80;--good:#7ddc8f;color-scheme:dark;}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--page);color:var(--ink);font-family:var(--ui);font-size:19px;line-height:1.3}
#app{max-width:760px;margin:0 auto;padding:14px 14px 28px;display:flex;flex-direction:column;gap:14px}

/* Teletekst-scherm */
.tt{background:#000;box-shadow:inset 0 6px 0 #e10600;color:var(--tt-w);font-family:var(--tt);font-size:clamp(21px,4.8vw,31px);line-height:1.12;
  padding:.45em .6em .6em;border:10px solid #262626;border-radius:16px;overflow-wrap:anywhere}
.tt p{margin:.35em 0}
.y{color:var(--tt-y)}.c{color:var(--tt-c)}.g{color:var(--tt-g)}.m{color:var(--tt-m)}.r{color:var(--tt-r)}.w{color:var(--tt-w)}
.tt-head{display:flex;justify-content:space-between;gap:.6em;flex-wrap:wrap}
.tt-band{background:var(--tt-b);color:var(--tt-y);margin:.3em -.6em .45em;padding:0 .6em}
.tt-band.groen{background:var(--tt-g);color:#000}
.tt-band.roze{background:var(--tt-m);color:#000}
.dh{display:block;height:2.05em;line-height:1;transform:scaleY(2);transform-origin:0 0;padding-top:.02em}
.tt-row{display:grid;grid-template-columns:4.6em 1fr;gap:.5em;margin:.12em 0}
.tt-lab{color:var(--tt-c)}
.tt-sub{color:var(--tt-c);margin-top:.35em}
.tt-club{display:grid;grid-template-columns:6.2em 1fr;gap:.5em}
.jaren{display:flex;gap:10px;flex-wrap:wrap}.jaren select{font:inherit;font-size:21px;font-weight:600;padding:7px 10px;border:2px solid var(--line);border-radius:4px;background:var(--page);color:var(--ink)}
.tt-hidden{color:#4a4a4a}
.tt-vraag{color:var(--tt-w);font-size:1.08em}
.tt-foot{display:flex;justify-content:space-between;gap:.6em;margin-top:.5em;flex-wrap:wrap}
.dim{color:#2b2b2b}
.tt-naam{color:var(--tt-y);font-size:1.75em;line-height:1.05;margin:.15em 0 .2em}
.tt-code{color:var(--tt-y);font-size:3.4em;line-height:1;letter-spacing:.18em;margin:.1em 0 .15em}
.dict{display:flex;align-items:center;gap:8px;margin:2px 0 6px}.dict input{width:20px;height:20px}
.egg{touch-action:manipulation;user-select:none;-webkit-user-select:none}
.egg-ans{font-size:.5em;color:var(--tt-c);opacity:.75;letter-spacing:.02em;vertical-align:.1em}
.flash{animation:flash 1s steps(1) 3}
@keyframes flash{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.flash{animation:none}}

/* Algemene bediening */
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
h2{font-size:23px;font-weight:800;margin:0 0 4px}
.knoppen{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.knop{font-family:var(--ui);font-size:20px;font-weight:600;padding:9px 16px;border:2px solid var(--ink);background:transparent;color:var(--ink);border-radius:4px}
.knop.hoofd{background:var(--ink);color:var(--page)}
.knop:disabled{opacity:.45;cursor:default}
.knop.stil{border-color:transparent;color:var(--muted);padding-left:6px;padding-right:6px}
.instel{display:flex;flex-direction:column;gap:16px}
.twee{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:560px){.twee{grid-template-columns:1fr 1fr}}
.blok{border:2px solid var(--line);border-radius:6px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.veld{display:flex;flex-direction:column;gap:4px;font-weight:600}
.veld input,.raad input{font:inherit;font-size:22px;font-weight:600;padding:9px 11px;border:2px solid var(--line);border-radius:4px;background:var(--page);color:var(--ink);min-width:0}
#code{text-transform:uppercase;letter-spacing:.2em;font-size:26px}
.hint{color:var(--muted);font-size:17px;margin:0}
.fout{color:var(--bad);font-weight:600;margin:0}
.goed{color:var(--good);font-weight:600;margin:0}
fieldset{border:0;padding:0;margin:0}
legend{font-weight:800;font-size:23px;padding:0;margin-bottom:6px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{padding:7px 14px;font-size:19px;font-weight:600;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:4px}
.seg button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--page)}

/* Antwoord typen */
.raad{display:flex;gap:8px}
.raad input{flex:1;font-size:24px;padding:12px}
.raad .knop{font-size:22px;padding:10px 20px}
.melding{min-height:1.4em;margin:6px 0 0;font-size:20px;font-weight:600}
.uitslag{font-size:24px;font-weight:800;margin:0 0 8px}

/* Stand */
.stand{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.stand li{display:grid;grid-template-columns:14px 1fr auto;align-items:center;gap:10px;padding:6px 10px;border-radius:4px;background:var(--surface);font-size:21px;font-weight:600}
.stand li.ik{outline:2px solid var(--ink)}
.stand .chip{width:14px;height:14px;border-radius:2px;background:var(--c)}
.stand .pt{font-weight:800;font-size:24px}
.stand .weg{color:var(--muted);font-weight:500;font-size:16px}
.banner{background:var(--bad);color:#fff;padding:8px 12px;border-radius:4px;font-weight:600;margin:0}
</style>
</head>

const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/ø/g,"o").replace(/[ðđ]/g,"d").replace(/æ/g,"ae").replace(/ß/g,"ss").replace(/þ/g,"th").replace(/[^a-z0-9]+/g," ").trim();
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function lev(a,b){
  if (Math.abs(a.length-b.length)>2) return 9;
  let prev = Array.from({length:b.length+1},(_,j)=>j);
  for (let i=1;i<=a.length;i++){ const cur=[i]; for (let j=1;j<=b.length;j++) cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1)); prev=cur; }
  return prev[b.length];
}
function isGoed(tekst, item){
  const t = norm(tekst); if (!t) return false;
  const naam = antwoordVan(item);
  return [naam, ...((SPELER[naam]||{}).alias||[]), ...(item.alias||[])].map(norm)
    .some(a => t===a || (a.length>=5 && lev(t,a) <= (a.length>=10?2:1)));
}
function bouwRondes(n, van, tot){
  const inE = x => inJaren(x, van, tot);
  const p = shuffle(ALLES.filter(x=>x.type==="p" && inE(x))), v = shuffle(ALLES.filter(x=>x.type==="v" && inE(x))), uit = [], gebruikt = new Set();
  const pak = lijst => { const i = lijst.findIndex(x=>!gebruikt.has(antwoordVan(x))); if (i<0) return null; const x = lijst.splice(i,1)[0]; gebruikt.add(antwoordVan(x)); return x; };
  for (let i=0; uit.length<n; i++){ const x = (i%2===1 ? pak(v) : null) || pak(p) || pak(v); if (!x) break; uit.push(x.id); }
  return uit;
}

/* ---------- Verbinding (Firebase) ---------- */
const CFG = window.F1Q_CONFIG || {};
const FB = (window.firebase && CFG.apiKey && CFG.databaseURL) ? window.firebase.initializeApp(CFG) : null;
const RTDB = FB ? FB.database() : null;
const aangemeld = FB ? FB.auth().signInAnonymously().then(c => c.user.uid).catch(() => null) : Promise.resolve(null);
const binnen = (p, ms) => Promise.race([p, new Promise((_, nee) => setTimeout(() => nee(new Error("timeout")), ms))]);

// Room on the Realtime Database: every peer writes a merged presence object to rooms/<code>/peers/<peer>,
// removed by the server on disconnect. The host's presence carries the full game state.
// Presence is stored as a JSON string, so arrays and nulls survive the round trip.
const ROOM = RTDB ? {
  join: async kanaal => {
    const uid = await aangemeld;
    if (!uid) throw new Error("auth");
    const lijst = RTDB.ref(`rooms/${kanaal}/peers`), mij = lijst.push(), info = RTDB.ref(".info/connected");
    let staat = {}, peers = [], opPeers = null, opVerbinding = null, weg = false;
    const schrijf = () => mij.set({by:uid, data:JSON.stringify(staat)});
    const opLijst = sn => {
      peers = Object.entries(sn.val() || {}).map(([k, p]) => {
        let data = {}; try { data = JSON.parse(p.data); } catch(e){}
        return {peer:k, by:p.by, sameTab:k === mij.key, presence:data};
      });
      if (opPeers && !weg) opPeers({peers});
    };
    const opInfo = sn => {
      if (weg) return;
      const online = sn.val() === true;
      if (online){ mij.onDisconnect().remove(); schrijf().catch(()=>{}); }
      if (opVerbinding) opVerbinding(online);
    };
    await binnen(mij.onDisconnect().remove().then(schrijf), 10000);
    lijst.on("value", opLijst, () => { if (opVerbinding) opVerbinding(false); });
    info.on("value", opInfo);
    return {
      onPeers(cb){ opPeers = cb; cb({peers}); },
      onConnection(cb){ opVerbinding = cb; },
      presence(deel){ staat = {...staat, ...deel}; return schrijf(); },
      async leave(){ weg = true; lijst.off("value", opLijst); info.off("value", opInfo); await mij.onDisconnect().cancel(); await mij.remove(); }
    };
  }
} : null;

let HS = [], scoreFout = false, hsTab = "1", hsStop = null, hsAuto = -1;
const HS_TABS = [["1","Alleen"],["2","2 spelers"],["3","3 spelers"],["4","4+ spelers"]];
const hsCat = n => String(Math.max(1, Math.min(4, n || 1)));
function volgHS(){
  if (!RTDB) return;
  if (hsStop) hsStop();
  const tab = hsTab, q = RTDB.ref(`highscores/${tab}`).orderByChild("score").limitToLast(10);
  const cb = sn => {
    if (tab !== hsTab) return;
    const rijen = []; sn.forEach(c => { rijen.push(c.val()); });
    HS = rijen.sort((a,b) => (b.score - a.score) || (a.ts - b.ts)); vulHS();
  };
  q.on("value", cb, () => {});
  hsStop = () => q.off("value", cb);
}
function kiesHS(cat){ if (cat === hsTab) return; hsTab = cat; HS = []; vulHS(); volgHS(); }
volgHS();
function vulHS(){
  const el = document.getElementById("hs"); if (!el) return;
  if (!RTDB){ el.innerHTML = ""; return; }
  const rows = HS.length
    ? HS.map((h,i) => `<div class="tt-row"><span class="${i===0?"y":"c"}">${i+1}.</span><span style="display:flex;justify-content:space-between;gap:.5em"><span>${esc(h.naam || "?")} <span class="c">${esc(h.rondes || "?")} r · ${esc(h.era || "")}${hsTab === "4" && h.spelers ? " · " + esc(h.spelers) + " sp." : ""}</span></span><span class="${i===0?"y":"w"}">${Number(h.score) || 0}</span></span></div>`).join("")
    : `<p class="c">Nog geen scores in deze lijst. Speel een potje!</p>`;
  el.innerHTML = `<h2>Top 10 aller tijden</h2>${seg("hstab", HS_TABS, hsTab)}<section class="tt"><div class="tt-band groen"><span class="dh">TOP 10 · ${esc((HS_TABS.find(t => t[0] === hsTab) || [])[1] || "")}</span></div>${rows}</section>`;
}
async function bewaarScores(){
  if (!RTDB || !H) return;
  const rondes = H.volgorde.length, spelers = H.st.length, cat = hsCat(spelers), era = jarenLabel(setup.van, setup.tot);
  kiesHS(cat);
  const uid = await aangemeld; let mislukt = !uid;
  for (const x of H.st){
    if (!uid || !(x.s > 0)) continue;
    const id = String(x.k).replace(/[^A-Za-z0-9_-]/g,"_").slice(0,100) || "speler";
    const nieuw = {naam:String(x.n).slice(0,16), score:x.s, rondes, spelers, era, ts:Date.now()};
    try { await RTDB.ref(`highscores/${cat}/${id}`).transaction(oud => (oud && Number(oud.score) >= x.s) ? undefined : nieuw); }
    catch(e){ mislukt = true; }
  }
  if (mislukt){ scoreFout = true; renderAlles(); }
}

async function verbind(c){
  NR = null; verbonden = true;
  if (!ROOM) return false;
  try { NR = await ROOM.join("f1q-" + c.toLowerCase()); } catch(e){ NR = null; return false; }
  NR.onPeers(ch => { peers = ch.peers; opPeers(); }, () => { verbonden = false; renderAlles(); });
  NR.onConnection(v => { if (verbonden !== v){ verbonden = v; renderAlles(); } });
  return true;
}
function opPeers(){
  if (rol === "speler"){
    const mij = peers.find(p => p.sameTab);
    if (mij) ik.key = mij.by || mij.peer;
    const host = peers.find(p => !p.sameTab && p.presence && p.presence.rol === "host" && p.presence.spel);
    hostGezien = !!host;
    if (host) zetStaat(host.presence.spel);
    renderAlles();
  } else if (rol === "host" && H){
    let veranderd = false;
    for (const p of peers){
      if (p.sameTab || !p.presence || p.presence.rol !== "speler") continue;
      const k = p.by || p.peer, n = String(p.presence.naam || "Speler").slice(0,16);
      const e = H.st.find(x => x.k === k);
      if (!e){ H.st.push({k, n, s:0}); veranderd = true; }
      else if (e.n !== n){ e.n = n; veranderd = true; }
      const g = p.presence.goed;
      if (g && g.rid === H.rid && H.fase === "spel" && verwerkGoed(k, n, String(g.txt || ""))) veranderd = true;
    }
    if (veranderd) publiceer(); else renderAlles();
  }
}
function zetStaat(s){
  if (!s) return;
  if (s.rid !== lokaal.rid || s.lvl !== lokaal.lvl) lokaal = {rid:s.rid, lvl:s.lvl, start:Date.now()};
  if (!S || s.rid !== S.rid) ui.ingestuurd = -1;
  S = s;
}

function publiceer(){
  const s = {fase:H.fase, rid:H.rid, nr:H.nr, tot:H.volgorde.length || setup.rondes, item:H.item, lvl:H.lvl, max:H.max,
             tempo:H.tempo, win:H.win, st:H.st.slice(0,30), host:ik.naam, jaren:jarenLabel(setup.van, setup.tot)};
  zetStaat(s);
  if (NR) NR.presence({rol:"host", naam:ik.naam, spel:s}).catch(()=>{});
  renderAlles();
}
function startSpel(){
  H.volgorde = bouwRondes(setup.rondes, setup.van, setup.tot); H.tempo = setup.tempo; H.nr = 0; scoreFout = false;
  H.st.forEach(x => x.s = 0);
  volgendeRonde();
}
function volgendeRonde(){
  if (H.nr >= H.volgorde.length){ H.fase = "einde"; H.item = null; publiceer(); bewaarScores(); return; }
  H.item = H.volgorde[H.nr]; H.nr++; H.rid++;
  H.max = BYID[H.item].type === "p" ? 4 : 3; H.lvl = 1; H.win = null; H.fase = "spel"; H.hintStart = Date.now();
  publiceer();
}
function volgendeHint(){
  if (H.lvl < H.max){ H.lvl++; H.hintStart = Date.now(); } else { H.fase = "onthuld"; H.win = null; }
  publiceer();
}
function verwerkGoed(k, n, txt){
  if (H.fase !== "spel" || !isGoed(txt, BYID[H.item])) return false;
  const p = H.max - H.lvl + 1;
  let e = H.st.find(x => x.k === k); if (!e){ e = {k, n, s:0}; H.st.push(e); }
  e.s += p; H.win = {k, n, p}; H.fase = "onthuld";
  return true;
}
setInterval(() => {
  if (H && H.fase === "spel" && Date.now() - H.hintStart >= H.tempo*1000) volgendeHint();
  updateBalk();
}, 200);
setInterval(() => { app.querySelectorAll(".klok").forEach(k => k.textContent = klok()); }, 1000);

/* ---------- Acties ---------- */
function naamOk(){
  const n = (document.getElementById("naam")?.value || "").trim().slice(0,16);
  if (!n){ renderStart("Vul eerst je naam in."); return false; }
  ik.naam = n; bewaarNaam(n); return true;
}
function bezig(tekst){ scherm = "bezig"; app.dataset.v = "bezig"; app.innerHTML = `<section class="tt">${kop("")}<p class="y flash">${esc(tekst)}</p></section>`; }

async function hostStart(){
  if (!naamOk()) return;
  rol = "host"; code = maakCode();
  bezig("Spel aanmaken…");
  ik.key = (await aangemeld) || "host";
  H = {fase:"lobby", rid:0, nr:0, item:null, lvl:0, max:0, tempo:setup.tempo, win:null, st:[], volgorde:[], hintStart:0};
  if (setup.meespelen) H.st.push({k:ik.key, n:ik.naam, s:0});
  await verbind(code);
  scherm = "spel"; publiceer();
}
async function meedoen(){
  if (!naamOk()) return;
  const c = (document.getElementById("code")?.value || "").toUpperCase().replace(/[^A-Z0-9]/g,"");
  if (c.length !== 4) return renderStart("Vul de code van 4 tekens in.");
  code = c; rol = "speler";
  bezig("Verbinden…");
  if (!ROOM) return renderStart("Geen verbinding met de spelserver. Meedoen lukt nu niet.");
  if (!(await verbind(code))) return renderStart("Verbinden lukte niet. Probeer het opnieuw.");
  NR.presence({rol:"speler", naam:ik.naam}).catch(()=>{});
  zoekStart = Date.now(); scherm = "spel"; renderAlles();
  setTimeout(renderAlles, 6000);
}
function verlaten(){
  if (NR) NR.leave().catch(()=>{});
  NR = null; H = null; S = null; rol = null; peers = []; hostGezien = false;
  lokaal = {rid:-1, lvl:-1, start:0}; ui = {cooldown:0, ingestuurd:-1, actieKey:""};
  renderStart();
}
function raad(auto){
  const inp = document.getElementById("gok"), m = document.getElementById("melding");
  if (!inp || !S || S.fase !== "spel") return;
  const txt = inp.value.trim(); if (!txt) return;
  if (Date.now() < ui.cooldown){ m.textContent = "Even wachten…"; m.className = "melding"; return; }
  const goed = isGoed(txt, BYID[S.item]) ? txt : undefined;
  if (goed !== undefined){
    if (rol === "host"){ if (verwerkGoed(ik.key, ik.naam, goed)) publiceer(); }
    else { ui.ingestuurd = S.rid; if (NR) NR.presence({goed:{rid:S.rid, txt:goed.slice(0,60)}}).catch(()=>{}); renderAlles(); }
  } else {
    if (auto){ m.textContent = `${txt} is het niet. Probeer het nog eens.`; }
    else { ui.cooldown = Date.now() + 2000; m.textContent = `${txt} is het niet. Over 2 seconden mag je weer.`; }
    m.className = "melding fout";
    inp.select();
  }
}

app.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b || b.disabled) return;
  const a = b.dataset.act, v = b.dataset.v;
  if (a === "host") hostStart();
  else if (a === "join") meedoen();
  else if (a === "rondes"){ setup.rondes = +v; renderAlles(); }
  else if (a === "tempo"){ setup.tempo = +v; renderAlles(); }
  else if (a === "jaren"){ const [x,y] = v.split("-").map(Number); setup.van = x; setup.tot = y; renderAlles(); }
  else if (a === "hstab"){ kiesHS(v); }
  else if (a === "mee"){
    setup.meespelen = v === "1";
    H.st = H.st.filter(x => x.k !== ik.key);
    if (setup.meespelen) H.st.unshift({k:ik.key, n:ik.naam, s:0});
    publiceer();
  }
  else if (a === "start") startSpel();
  else if (a === "hint") volgendeHint();
  else if (a === "volgende") volgendeRonde();
  else if (a === "lobby"){ H.fase = "lobby"; H.win = null; H.item = null; H.volgorde = []; H.st.forEach(x => x.s = 0); publiceer(); }
  else if (a === "verlaten") verlaten();
});
app.addEventListener("click", e => {
  if (!e.target.closest || !e.target.closest(".egg")) return;
  const nu = Date.now();
  if (nu - eggT < 450){
    eggT = 0;
    if (S && S.item){ eggRid = eggRid === S.rid ? -1 : S.rid; renderAlles(); }
  } else eggT = nu;
});
app.addEventListener("change", e => {
  const id = e.target.id;
  if (id !== "jvan" && id !== "jtot") return;
  const w = +e.target.value;
  if (id === "jvan"){ setup.van = w; if (setup.tot < w) setup.tot = w; }
  else { setup.tot = w; if (setup.van > w) setup.van = w; }
  renderAlles();
});
app.addEventListener("submit", e => { e.preventDefault(); if (e.target.id === "raad") raad(); else if (e.target.id === "meedoen") meedoen(); });

/* ---------- Weergave ---------- */
function rij(label, waarde, kleur){
  return `<div class="tt-row"><span class="tt-lab">${label}</span><span class="${waarde?kleur:""}">${waarde ? esc(waarde) : '<span class="tt-hidden">▒▒▒▒▒▒▒▒▒▒</span>'}</span></div>`;
}
function paneelPaspoort(r, L, open){
  const z = n => open || L >= n;
  return `<div class="tt-band"><span class="dh">RACEPASPOORT</span></div>
    ${rij("Geboren", z(1) ? `${r.jaar} (${new Date().getFullYear() - r.jaar} jaar)` : null, "y")}
    ${rij("In F1", z(1) ? (r.tot >= JMAX ? `${r.van}–nu` : jarenLabel(r.van, r.tot)) : null, "w")}
    ${rij("Land", z(2) ? r.land : null, "g")}
    ${rij("Weetje", z(3) ? r.weetje : null, "w")}
    <div class="tt-sub">Teams</div>
    ${z(4) ? r.clubs.slice(-3).map(([j,c]) => `<div class="tt-club"><span class="m">${esc(j)}</span><span>${esc(c)}</span></div>`).join("")
           : '<div class="tt-club"><span class="tt-hidden">▒▒▒▒▒▒▒</span><span class="tt-hidden">▒▒▒▒▒▒▒▒▒▒▒▒</span></div>'.repeat(3)}`;
}
function paneelVraag(r, L, open){
  return `<div class="tt-band roze"><span class="dh">QUIZVRAAG</span></div>
    <p class="tt-vraag">${esc(r.vraag)}</p>
    ${r.hints.map((h,i) => rij(`Hint ${i+1}`, (open || L >= i+2) ? h : null, "y")).join("")}`;
}
function standLijst(){
  const online = new Set(peers.map(p => p.by || p.peer));
  if (rol === "host") online.add(ik.key);
  const kleur = new Map(S.st.map((x,i) => [x.k, KLEUREN[i % KLEUREN.length]]));
  const lijst = S.st.slice().sort((a,b) => b.s - a.s);
  if (!lijst.length) return `<p class="hint">Nog niemand aangemeld.</p>`;
  return `<ul class="stand">${lijst.map(x => `<li class="${x.k===ik.key?"ik":""}"><span class="chip" style="--c:var(${kleur.get(x.k)})"></span>
    <span>${esc(x.n)}${x.k===ik.key?" (jij)":""}${NR && !online.has(x.k) ? ' <span class="weg">weg</span>' : ""}</span><span class="pt">${x.s}</span></li>`).join("")}</ul>`;
}
function jaarOpties(huidig){
  let o = ""; for (let j = JMIN; j <= JMAX; j++) o += `<option value="${j}" ${j===huidig?"selected":""}>${j}</option>`; return o;
}
function telTekst(){
  const c = AANTAL(setup.van, setup.tot, "p"), v = AANTAL(setup.van, setup.tot, "v"), n = c + v;
  return `<p class="hint">${c} coureurs en ${v} vragen in ${jarenLabel(setup.van, setup.tot)}.</p>` +
    (n < setup.rondes ? `<p class="fout">Te weinig voor ${setup.rondes} rondes: het spel wordt ${n} rondes.</p>` : "");
}
function seg(act, opties, huidig){
  return `<div class="seg">${opties.map(([v,l]) => `<button data-act="${act}" data-v="${v}" aria-pressed="${String(v)===String(huidig)}">${l}</button>`).join("")}</div>`;
}
function banner(){
  if (rol === "speler" && S && !hostGezien) return `<p class="banner">De host is niet meer verbonden. Wacht even of verlaat het spel.</p>`;
  if (NR && !verbonden) return `<p class="banner">Verbinding weggevallen. Opnieuw verbinden…</p>`;
  return "";
}

function renderStart(fout = ""){
  scherm = "start"; app.dataset.v = "start";
  app.innerHTML = `<section class="tt">${kop("")}
      <div class="tt-band"><span class="dh">RAAD DE COUREUR</span></div>
      <p class="c">Formule 1, ${JMIN} tot nu. ${COUREURS.length} coureurs en ${VRAGEN.length} weetjes. Kies straks je seizoenen.</p>
      <p>Iedereen speelt op zijn eigen telefoon. De hints komen één voor één binnen.</p>
      <p>Typ het antwoord: meestal een coureur, soms een team of circuit. Wie het als eerste goed heeft, pakt de punten.</p>
      <p class="g">Hoe eerder je hem hebt, hoe meer punten.</p>
    </section>
    <section class="instel">
      <label class="veld">Jouw naam<input id="naam" maxlength="16" autocomplete="nickname" value="${esc(ik.naam)}" placeholder="Bijvoorbeeld Mad Max"></label>
      <div class="twee">
        <div class="blok"><h2>Spel starten</h2><p class="hint">Je krijgt een code die je deelt met de anderen.</p>
          <div><button class="knop hoofd" data-act="host">Nieuw spel</button></div></div>
        <form class="blok" id="meedoen"><h2>Meedoen</h2>
          <label class="veld">Code<input id="code" maxlength="4" autocapitalize="characters" autocomplete="off" spellcheck="false" placeholder="ABCD" value="${esc(code)}"></label>
          <div><button class="knop hoofd" type="submit">Meedoen</button></div></form>
      </div>
      ${fout ? `<p class="fout" role="alert">${esc(fout)}</p>` : ""}
    </section>
    <div id="hs"></div>`;
  vulHS();
}

function renderAlles(){
  if (scherm !== "spel") return;
  if (!S) return renderZoeken();
  if (S.fase === "lobby") return renderLobby();
  if (S.fase === "einde") return renderEinde();
  renderSpel();
}
function renderZoeken(){
  app.dataset.v = "zoeken";
  const lang = Date.now() - zoekStart > 5500;
  app.innerHTML = `<section class="tt">${kop("code " + esc(code))}
      ${lang ? `<p class="r">Geen spel gevonden met code ${esc(code)}.</p><p>Controleer de code, of vraag de host of het spel nog openstaat.</p>`
             : `<p class="y flash">Spel ${esc(code)} zoeken…</p>`}</section>
    <div class="knoppen"><button class="knop" data-act="verlaten">Terug</button></div>`;
}
function renderLobby(){
  app.dataset.v = "lobby";
  const host = rol === "host";
  app.innerHTML = `${banner()}<section class="tt">${kop("lobby")}
      <div class="tt-band"><span class="dh">SPELCODE</span></div>
      <div class="tt-code">${esc(code)}</div>
      ${host ? (NR ? `<p>Laat de anderen deze pagina openen en de code invullen.</p>`
                   : `<p class="r">Geen verbinding met anderen. Je kunt wel alleen oefenen.</p>`)
             : `<p>Je doet mee. Wachten tot <span class="y">${esc(S.host || "de host")}</span> het spel start…</p>${S.jaren ? `<p>Seizoenen: <span class="c">${esc(S.jaren)}</span></p>` : ""}`}
    </section>
    <section class="instel">
      <div><h2>Spelers (${S.st.length})</h2>${standLijst()}</div>
      ${host ? `
      <fieldset><legend>Seizoenen</legend>${seg("jaren",PRESETS,setup.van+"-"+setup.tot)}
        <div class="jaren"><label class="veld">Van<select id="jvan">${jaarOpties(setup.van)}</select></label><label class="veld">Tot en met<select id="jtot">${jaarOpties(setup.tot)}</select></label></div>
        ${telTekst()}</fieldset>
      <fieldset><legend>Rondes</legend>${seg("rondes",[[10,"10"],[15,"15"],[20,"20"]],setup.rondes)}</fieldset>
      <fieldset><legend>Tijd per hint</legend>${seg("tempo",[[9,"Rustig, 9 s"],[7,"Normaal, 7 s"],[5,"Snel, 5 s"]],setup.tempo)}</fieldset>
      <fieldset><legend>Dit toestel</legend>${seg("mee",[[1,"Ik speel mee"],[0,"Alleen als scherm"]],setup.meespelen?1:0)}</fieldset>
      <div class="knoppen"><button class="knop hoofd" data-act="start" ${S.st.length?"":"disabled"}>Start het spel</button><button class="knop stil" data-act="verlaten">Stoppen</button></div>`
      : `<div class="knoppen"><button class="knop stil" data-act="verlaten">Verlaten</button></div>`}
    </section>`;
}
function renderEinde(){
  app.dataset.v = "einde";
  const stand = S.st.slice().sort((a,b) => b.s - a.s);
  const gelijk = stand.length > 1 && stand[0].s === stand[1].s;
  app.innerHTML = `${banner()}<section class="tt">${kop("eindstand")}
      <div class="tt-band"><span class="dh">EINDSTAND</span></div>
      ${stand.map((s,p) => `<div class="tt-row"><span class="${p===0?"y":"c"}">${p+1}.</span><span style="display:flex;justify-content:space-between;gap:.5em"><span>${esc(s.n)}</span><span class="${p===0?"y":"w"}">${s.s}</span></span></div>`).join("")}
      ${stand.length ? `<p class="${gelijk?"m":"g"} flash">${gelijk ? "Gelijkspel aan de top" : `${esc(stand[0].n)} wint`}</p>` : ""}
    </section>
    <div class="knoppen">${rol === "host" ? `<button class="knop hoofd" data-act="lobby">Nieuw potje</button><button class="knop stil" data-act="verlaten">Stoppen</button>`
      : `<p class="hint">Wachten op een nieuw potje…</p><button class="knop stil" data-act="verlaten">Verlaten</button>`}</div>
    ${scoreFout && rol === "host" ? `<p class="fout">Scores konden niet worden opgeslagen in de top 10.</p>` : ""}
    <div id="hs"></div>`;
  if (hsAuto !== S.rid){ hsAuto = S.rid; kiesHS(hsCat(S.st.length)); }
  vulHS();
}
function renderSpel(){
  if (app.dataset.v !== "spel"){
    app.dataset.v = "spel"; ui.actieKey = "";
    app.innerHTML = `<div id="banner"></div><section class="tt" id="paneel" aria-live="polite"></section><div id="actie"></div><div id="stand"></div>`;
  }
  const item = BYID[S.item], open = S.fase === "onthuld";
  let voet;
  if (!open){
    voet = `<div class="tt-foot"><span class="balk"></span><span><span class="c">hint ${S.lvl}/${S.max}</span> <span class="m">${S.max-S.lvl+1} pnt</span></span></div>`;
  } else {
    const wie = S.win ? `<div class="g">${esc(S.win.n)} pakt ${S.win.p} ${S.win.p===1?"punt":"punten"}</div>` : `<div class="r">Niemand had het</div>`;
    voet = `<div class="tt-band groen" style="margin-top:.5em">ANTWOORD</div><div class="tt-naam flash">${esc(antwoordVan(item))}</div>${wie}`;
  }
  document.getElementById("banner").innerHTML = banner();
  document.getElementById("paneel").innerHTML = kop(`ronde ${S.nr}/${S.tot}`) +
    (item.type === "p" ? paneelPaspoort(item, S.lvl, open) : paneelVraag(item, S.lvl, open)) + voet;
  document.getElementById("stand").innerHTML = `<h2>Stand</h2>${standLijst()}`;

  const speelt = rol === "speler" || setup.meespelen;
  const key = [S.fase, S.rid, ui.ingestuurd === S.rid, rol, speelt, S.win ? S.win.k : ""].join("|");
  if (key === ui.actieKey){ updateBalk(); return; }
  ui.actieKey = key;
  const actie = document.getElementById("actie");
  const hostKnop = rol === "host" ? `<button class="knop stil" data-act="hint">${S.lvl < S.max ? "Volgende hint" : "Antwoord tonen"}</button>` : "";
  if (!open){
    if (speelt && ui.ingestuurd !== S.rid){
      actie.innerHTML = `<form id="raad" class="raad" autocomplete="off">
          <input id="gok" type="text" autocapitalize="words" autocorrect="off" spellcheck="false" enterkeyhint="send" placeholder="Wie of wat is het?" aria-label="Jouw antwoord" maxlength="40">
          <button class="knop hoofd" type="submit">Raad</button></form>
        <p class="melding" id="melding" role="status"></p>
        <label class="hint dict"><input type="checkbox" id="autodict" ${autoDict ? "checked" : ""}> Dicteren: automatisch versturen na 1 seconde stilte</label>
        <div class="knoppen">${hostKnop}</div>`;
      const gokEl = document.getElementById("gok"); gokEl.focus({preventScroll:true});
      clearTimeout(dictT); let vorigeLen = 0;
      gokEl.addEventListener("input", ev => {
        clearTimeout(dictT);
        const sprong = gokEl.value.length - vorigeLen; vorigeLen = gokEl.value.length;
        const dicteer = /dictation/i.test(ev.inputType || "") || sprong >= 3;
        if (!autoDict || !dicteer || !gokEl.value.trim()) return;
        dictT = setTimeout(() => { if (document.getElementById("gok") === gokEl && gokEl.value.trim()) raad(true); }, 1000);
      });
      document.getElementById("autodict").addEventListener("change", ev => { autoDict = ev.target.checked; clearTimeout(dictT); });
    } else if (speelt){
      actie.innerHTML = `<p class="goed">Goed! Even kijken of je de snelste was…</p><div class="knoppen">${hostKnop}</div>`;
    } else {
      actie.innerHTML = `<div class="knoppen">${hostKnop.replace("knop stil","knop")}<button class="knop stil" data-act="verlaten">Stoppen</button></div>`;
    }
  } else {
    let tekst;
    if (!S.win) tekst = "Niemand had het.";
    else if (S.win.k === ik.key) tekst = `Jij was de snelste: +${S.win.p}`;
    else tekst = `${S.win.n} was het snelst.` + (ui.ingestuurd === S.rid ? " Jij had het ook goed, net te laat." : "");
    const laatste = S.nr >= S.tot;
    actie.innerHTML = `<p class="uitslag">${esc(tekst)}</p><div class="knoppen">` +
      (rol === "host" ? `<button class="knop hoofd" data-act="volgende">${laatste ? "Bekijk de eindstand" : "Volgende ronde"}</button><button class="knop stil" data-act="verlaten">Stoppen</button>`
                      : `<span class="hint">Wachten op de volgende ronde…</span><button class="knop stil" data-act="verlaten">Verlaten</button>`) + `</div>`;
  }
  updateBalk();
}
function updateBalk(){
  const el = app.querySelector(".balk"); if (!el || !S || S.fase !== "spel") return;
  const t = (Date.now() - lokaal.start) / 1000;
  const vol = Math.max(0, Math.min(14, Math.round((1 - t / S.tempo) * 14)));
  el.innerHTML = `<span class="g">${"█".repeat(vol)}</span><span class="dim">${"█".repeat(14-vol)}</span>`;
}

renderStart();
</script>

</body></html>
